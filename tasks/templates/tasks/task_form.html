{% extends "tasks/base.html" %}

{% block title %}{{ page_title }} | Team Tasks{% endblock %}

{% block content %}
    <h1>{{ page_title }}</h1>
    <p>Team: {{ team.name }}</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">{{ submit_label }}</button>
    </form>

    <p>
        <a href="{% url 'tasks:list' %}">Back to tasks</a>
    </p>
{% endblock %}
